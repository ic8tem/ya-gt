# YA-GT - compilazione, prova di avvio e pacchetti per Windows 10/11 e Linux (.NET 10 + Avalonia) e Windows 7 SP1/8.1 (.NET Framework 4.8 + WinForms).
# A ogni push su main: compilazione e prova di avvio con fotografie dello schermo (rami ci-shot-*); gli errori di compilazione
# finiscono nel ramo ci-log. Con un tag vX.Y.Z, un push sul ramo release o l'avvio a mano: installatori, zip portatili e Release.
name: build

on:
  push:
    branches: [ main, release ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: windows      # Windows 10 e 11
            proj: src/YaGt/YaGt.csproj
            rid: win-x64
            arch: x64
            selfcontained: 'true'
          - flavor: windows7     # Windows 7 SP1 e 8.1 (.NET Framework 4.8)
            proj: src/YaGt7/YaGt7.csproj
            rid: win-x64
            arch: x64
            selfcontained: 'false'
          - flavor: windows7
            proj: src/YaGt7/YaGt7.csproj
            rid: win-x86
            arch: x86
            selfcontained: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.selfcontained }}" = "true" ]; then SC="--self-contained true"; else SC=""; fi
          dotnet publish ${{ matrix.proj }} -c Release -r ${{ matrix.rid }} $SC -p:Version=${{ env.VER }} -p:DebugType=none -o publish/${{ matrix.flavor }}-${{ matrix.arch }} -clp:NoSummary 2>&1 | tee build.log
      - name: Errori di compilazione (ramo ci-log)
        if: failure() && matrix.arch == 'x64'
        shell: bash
        run: |
          grep -E ": error |error NU|error MSB" build.log | sort -u > errori.txt || true
          cp build.log tutto.txt
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout --orphan ci-log-${{ matrix.flavor }}
          git rm -rf --cached . > /dev/null
          git add -f errori.txt tutto.txt
          git commit -m "errori di compilazione ${{ matrix.flavor }} ($GITHUB_SHA)"
          git push -f origin ci-log-${{ matrix.flavor }}
      - name: Controllo dei file
        shell: pwsh
        run: |
          $d = "publish\${{ matrix.flavor }}-${{ matrix.arch }}"
          if (-not (Test-Path "$d\YA-GT.exe")) { throw "manca YA-GT.exe" }
          if (-not (Test-Path "$d\CALL3.TXT")) { throw "manca CALL3.TXT" }
          $n = (Get-ChildItem -Recurse -File $d | Measure-Object).Count
          Write-Output "::notice title=${{ matrix.flavor }} ${{ matrix.arch }}::$n file"
      # prova di avvio (solo x64): prima la finestra di avvio, poi la mappa con spot di esempio (YAGT_DEMO) e il giro dei livelli
      - name: Prova di avvio
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $src = "publish\${{ matrix.flavor }}-${{ matrix.arch }}"
          $d0 = "$env:RUNNER_TEMP\prova0"
          Copy-Item -Recurse $src $d0
          $p0 = Start-Process "$d0\YA-GT.exe" -PassThru
          Start-Sleep 8; Shot "a0-finestra-di-avvio"
          if (-not $p0.HasExited) { Stop-Process -Id $p0.Id -Force }
          $d = "$env:RUNNER_TEMP\prova"
          Copy-Item -Recurse $src $d
          Set-Content "$d\YA-GT.ini" "call=IC8TEM`r`nloc=JN70cn`r`nsrc_rbn=0`r`nsrc_dm4x=0`r`nsrc_cl2=0`r`nrefresh_min=1"
          $env:YAGT_SKIPSTART = "1"; $env:YAGT_DEMO = "1"; $env:YAGT_TOUR = "15"; $env:YAGT_MAXIMIZED = "1"
          $p = Start-Process "$d\YA-GT.exe" -PassThru
          Start-Sleep 12; Shot "01-mercatore"
          Start-Sleep 18; Shot "02-kc2g-aurora"
          Start-Sleep 15; Shot "03-azimutale"
          Start-Sleep 15; Shot "04-percorsi"
          Start-Sleep 15; Shot "05-lotw-mercatore"
          $alive = -not $p.HasExited
          foreach ($f in @("errore-avvio.txt", "Dati\errori.txt")) { if (Test-Path "$d\$f") { Copy-Item "$d\$f" ("shots\" + (Split-Path $f -Leaf)) } }
          Set-Content shots\stato.txt "in esecuzione: $alive"
          if ($alive) { Stop-Process -Id $p.Id -Force }
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout --orphan ci-shot-${{ matrix.flavor }}
          git rm -rf --cached . > $null
          git add -f shots
          git commit -m "prova di avvio ${{ matrix.flavor }} ($env:GITHUB_SHA)"
          git push -f origin ci-shot-${{ matrix.flavor }}
          git checkout -f $env:GITHUB_SHA
          if (-not $alive) { Write-Output "::error::il programma si e' chiuso"; exit 1 }
      - name: Installatore (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ env.VER }}" "/DArch=${{ matrix.arch }}" "/DFlavor=${{ matrix.flavor }}" "/DSourceDir=..\publish\${{ matrix.flavor }}-${{ matrix.arch }}" installer\YA-GT.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip portatile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\${{ matrix.flavor }}-${{ matrix.arch }}\* -DestinationPath dist\YA-GT-${{ env.VER }}-${{ matrix.flavor }}-${{ matrix.arch }}-portatile.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.arch }}
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ linux-x64, linux-arm64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: |
          set -o pipefail
          dotnet publish src/YaGt/YaGt.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ env.VER }} -p:DebugType=none -o publish/YA-GT -clp:NoSummary 2>&1 | tee build.log
          chmod +x publish/YA-GT/YA-GT
      - name: Errori di compilazione (ramo ci-log-linux)
        if: failure() && matrix.rid == 'linux-x64'
        run: |
          grep -E ": error |error NU|error MSB" build.log | sort -u > errori.txt || true
          cp build.log tutto.txt
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout --orphan ci-log-linux
          git rm -rf --cached . > /dev/null
          git add -f errori.txt tutto.txt
          git commit -m "errori di compilazione linux ($GITHUB_SHA)"
          git push -f origin ci-log-linux
      - name: Prova di avvio (Xvfb)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick fonts-dejavu > /dev/null
          Xvfb :99 -screen 0 1366x768x24 & sleep 3
          export DISPLAY=:99
          mkdir -p shots
          D=$RUNNER_TEMP/prova; cp -r publish/YA-GT $D
          printf 'call=IC8TEM\nloc=JN70cn\nsrc_rbn=0\nsrc_dm4x=0\nsrc_cl2=0\nrefresh_min=1\n' > $D/YA-GT.ini
          YAGT_SKIPSTART=1 YAGT_DEMO=1 YAGT_TOUR=15 YAGT_MAXIMIZED=1 $D/YA-GT > shots/console.txt 2>&1 &
          PID=$!
          sleep 15; import -window root shots/01-mercatore.png
          sleep 18; import -window root shots/02-kc2g-aurora.png
          sleep 15; import -window root shots/03-azimutale.png
          if kill -0 $PID 2>/dev/null; then echo "in esecuzione: True" > shots/stato.txt; kill $PID; else echo "in esecuzione: False" > shots/stato.txt; fi
          for f in errore-avvio.txt Dati/errori.txt; do [ -f "$D/$f" ] && cp "$D/$f" shots/ || true; done
          git config user.name "IC8TEM"; git config user.email "ic8tem@users.noreply.github.com"
          git checkout --orphan ci-shot-linux
          git rm -rf --cached . > /dev/null
          git add -f shots
          git commit -m "prova di avvio linux ($GITHUB_SHA)"
          git push -f origin ci-shot-linux
          git checkout -f $GITHUB_SHA
          grep -q True shots/stato.txt
      - name: Archivio tar.gz
        run: |
          mkdir -p dist
          tar -C publish -czf dist/YA-GT-${{ env.VER }}-${{ matrix.rid }}.tar.gz YA-GT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: YA-GT ${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: dist/*
